[package]
name = "wisp"
version = "0.1.2"
edition = "2024"
license = "MIT"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "wayland"] }

[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30", default-features = false, features = ["wayland", "wayland-dlopen", "wayland-csd-adwaita"] }

[profile.release]
lto = true
strip = true
